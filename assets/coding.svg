<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .line{transform-box:fill-box;transform-origin:left center;animation:type 4s steps(14) infinite}
      .l2{animation-delay:.6s}.l3{animation-delay:1.2s}.l4{animation-delay:1.8s}.l5{animation-delay:2.4s}
      @keyframes type{0%{transform:scaleX(0)}55%,100%{transform:scaleX(1)}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .handL{animation:tapL .35s ease-in-out infinite alternate}
      .handR{animation:tapR .35s ease-in-out infinite alternate;animation-delay:.17s}
      @keyframes tapL{to{transform:translateY(3px)}}
      @keyframes tapR{to{transform:translateY(3px)}}
      .steam{animation:rise 2.4s ease-in-out infinite;opacity:0}
      .s2{animation-delay:.8s}
      @keyframes rise{0%{transform:translateY(6px);opacity:0}40%{opacity:.6}100%{transform:translateY(-8px);opacity:0}}
      .head{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes bob{50%{transform:translateY(-2px)}}
      .star{animation:tw 3s ease-in-out infinite}
      .st2{animation-delay:1s}.st3{animation-delay:2s}
      @keyframes tw{50%{opacity:.15}}
    </style>
  </defs>
  <rect width="420" height="260" rx="16" fill="url(#bg)"/>
  <circle class="star" cx="40" cy="34" r="2" fill="#58a6ff"/>
  <circle class="star st2" cx="372" cy="46" r="2" fill="#8957e5"/>
  <circle class="star st3" cx="330" cy="24" r="1.5" fill="#58a6ff"/>
  <rect x="20" y="205" width="380" height="10" rx="3" fill="#30363d"/>
  <rect x="50" y="215" width="8" height="35" fill="#21262d"/><rect x="362" y="215" width="8" height="35" fill="#21262d"/>
  <rect x="78" y="120" width="14" height="85" rx="6" fill="#21262d"/>
  <path d="M95 205 L95 150 Q95 125 120 122 L150 122 Q170 125 170 150 L170 205 Z" fill="#1f6feb"/>
  <g class="head">
    <circle cx="132" cy="92" r="24" fill="#e0a87c"/>
    <path d="M108 88 Q112 62 136 64 Q158 66 156 90 Q146 74 126 76 Q114 78 108 88 Z" fill="#161b22"/>
    <path d="M106 90 Q106 66 132 66 Q158 66 158 90" fill="none" stroke="#8957e5" stroke-width="5"/>
    <rect x="101" y="86" width="9" height="16" rx="4" fill="#8957e5"/><rect x="154" y="86" width="9" height="16" rx="4" fill="#8957e5"/>
    <circle cx="140" cy="94" r="2" fill="#161b22"/>
    <path d="M136 104 Q142 108 148 104" fill="none" stroke="#161b22" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M185 205 L175 150 L330 150 L335 205 Z" fill="#21262d" stroke="#30363d" stroke-width="2"/>
