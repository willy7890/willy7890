  <rect x="285" y="170" width="10" height="20" fill="#30363d"/>
  <rect class="line" x="218" y="76" width="60" height="6" rx="3" fill="#58a6ff"/>
  <rect class="line l2" x="230" y="92" width="95" height="6" rx="3" fill="#8957e5"/>
  <rect class="line l3" x="230" y="108" width="70" height="6" rx="3" fill="#3fb950"/>
