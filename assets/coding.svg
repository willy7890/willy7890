  <rect class="line l5" x="218" y="140" width="45" height="6" rx="3" fill="#f0883e"/>
  <rect class="cursor" x="268" y="138" width="5" height="10" fill="#c9d1d9"/>
  <path d="M150 140 Q175 165 205 185" fill="none" stroke="#1f6feb" stroke-width="14" stroke-linecap="round"/>
  <circle class="handL" cx="208" cy="188" r="7" fill="#e0a87c"/>
